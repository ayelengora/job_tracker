databases:
  - name: job-tracker-db
    plan: free
    databaseName: job_tracker_production
    user: job_tracker

services:
  - type: web
    name: job-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
