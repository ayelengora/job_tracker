services:
  - type: web
    name: job-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      # Postgres vive en Neon (free, no expira), no en Render.
      # Pegá acá el connection string que te da Neon (con ?sslmode=require al final).
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      # Login con Google: los valores se cargan a mano en el panel de Render.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
